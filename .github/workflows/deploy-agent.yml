# ──────────────────────────────────────────────────────────────
# GitHub Actions workflow: Deploy Azure AI Foundry Agent
#
# Triggers on push to main (when agent source changes) or
# manually via workflow_dispatch.
#
# The workflow:
#   1. Checks out the repo
#   2. Sets up Python
#   3. Installs dependencies
#   4. Authenticates to Azure via OIDC (federated credentials)
#   5. Deploys the agent to Azure AI Foundry
#   6. Validates the deployment
# ──────────────────────────────────────────────────────────────

name: Deploy AI Agent to Azure AI Foundry

on:
  push:
    branches: [main]
    paths:
      - "agent_config.yaml"
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/deploy-agent.yml"
  workflow_dispatch:
    inputs:
      force_recreate:
        description: "Force delete and recreate the agent"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  id-token: write   # Required for OIDC authentication
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ────────────────────────────────────────────
  # Job 1: Deploy the agent
  # ────────────────────────────────────────────
  deploy:
    name: Deploy Agent
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Agent to AI Foundry
        working-directory: src
        env:
          AZURE_AI_PROJECT_ENDPOINT: ${{ secrets.AZURE_AI_PROJECT_ENDPOINT }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_AI_ACCOUNT_NAME: ${{ secrets.AZURE_AI_ACCOUNT_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_MODEL_DEPLOYMENT: ${{ vars.AZURE_MODEL_DEPLOYMENT || 'gpt-4o' }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_recreate }}" == "true" ]; then
            FORCE_FLAG="--force-recreate"
          fi
          python agent.py deploy $FORCE_FLAG

      - name: Validate Deployment
        working-directory: src
        env:
          AZURE_AI_PROJECT_ENDPOINT: ${{ secrets.AZURE_AI_PROJECT_ENDPOINT }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_AI_ACCOUNT_NAME: ${{ secrets.AZURE_AI_ACCOUNT_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: python validate.py

  # ────────────────────────────────────────────
  # Job 2: Provision infrastructure (optional)
  # ────────────────────────────────────────────
  infra:
    name: Provision Infrastructure
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production
    needs: []   # runs in parallel with deploy when triggered manually

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Plan
        working-directory: infra
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
        run: |
          terraform plan \
            -var="resource_group_name=${{ secrets.AZURE_RESOURCE_GROUP }}" \
            -var="ai_account_name=${{ secrets.AZURE_AI_ACCOUNT_NAME }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: infra
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
        run: terraform apply -auto-approve tfplan
